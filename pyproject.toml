[project]
name = "ejaytools"
version = "1.0.0"
description = "Reverse-engineered eJay *.MIX formats and tooling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Nelson Goncalves" }]
keywords = ["ejay", "reverse-engineering", "music", "python", "pxd", "mix"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
playback = ["sounddevice>=0.4"]
tui = ["textual>=0.40"]
pxd2wav = ["tkinterdnd2>=0.3"]
all = ["ejaytools[playback,tui,pxd2wav]"]

[project.urls]
Homepage = "https://hatebit.github.io/eJayTools/"
Repository = "https://github.com/hatebit/eJayTools"

[dependency-groups]
dev = ["pyinstaller>=6.0"]

[tool.uv]
package = false