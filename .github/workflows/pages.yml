name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install python-markdown
        run: python -m pip install --disable-pip-version-check markdown

      - name: Convert docs/*.md to web/src/*.html
        run: python docs/build_html.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the site into web/dist
        working-directory: web
        run: npm run build

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -R web/dist/. _site/
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4