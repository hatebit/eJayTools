name: Release Windows binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version shared by the three release tags (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller numpy sounddevice textual

      - name: Build the Windows bundles
        shell: bash
        run: |
          python apps/emp/packaging/build_emp_cli.py --clean
          python apps/emp/packaging/build_emp_tui.py --clean
          python apps/emr/packaging/build_emr_cli.py --clean

      - name: Smoke-test the bundles
        shell: bash
        run: |
          dist/emp-cli/emp-cli.exe --version
          dist/emp-tui/emp-tui.exe --version
          dist/emr-cli/emr-cli.exe --version

      - name: Publish the releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local target="$1" script="$2" tag="$1-$TAG"
            if gh release view "$tag" >/dev/null 2>&1; then
              # Re-run: refresh the archive on the release that already exists.
              python "$script" --tag "$tag" --skip-build --replace --yes
            else
              python "$script" --tag "$tag" --skip-build --yes
            fi
          }
          publish emp-cli apps/emp/packaging/release_emp_cli.py
          publish emp-tui apps/emp/packaging/release_emp_tui.py
          publish emr-cli apps/emr/packaging/release_emr_cli.py
