name: Release emp-cli

on:
  push:
    tags:
      - "v*"
      - "emp-cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version for the emp-cli release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-emp-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TARGET: emp-cli
      SCRIPT: apps/emp/packaging/release_emp_cli.py
      RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller numpy sounddevice

      - name: Resolve the release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$RAW_TAG"
          case "$tag" in
            "$TARGET"-v*) ;;
            v*) tag="$TARGET-$tag" ;;
            *) echo "::error::tag '$RAW_TAG' must be v<version> or $TARGET-v<version>"; exit 1 ;;
          esac
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "releasing $tag from $GITHUB_SHA"

      - name: Build the emp-cli bundle
        run: python apps/emp/packaging/build_emp_cli.py --clean

      - name: Smoke-test the bundle
        shell: bash
        run: dist/emp-cli/emp-cli.exe --version

      - name: Publish the emp-cli release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Re-run: refresh the archive on the release that already exists.
            python "$SCRIPT" --tag "$RELEASE_TAG" --skip-build --replace --yes
          else
            python "$SCRIPT" --tag "$RELEASE_TAG" --skip-build --yes
          fi
